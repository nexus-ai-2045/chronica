name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python sources
        # bot/ だけでなく pipeline/ crypto/ も対象にする。
        # 過去に pipeline/ の import 漏れが公開まで通り抜けた実績があるため。
        run: python -m compileall -q bot pipeline crypto

      - name: Static check (undefined names must be zero)
        # pyflakes の "undefined name" は起動即クラッシュに直結する。
        # ここは 0 件を維持する (ラチェット)。
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes bot pipeline crypto > flakes.txt || true
          cat flakes.txt
          if grep -q "undefined name" flakes.txt; then
            echo "::error::undefined name が検出されました (起動不能に直結します)"
            exit 1
          fi

      - name: Unit tests
        run: python bot/test_store.py

  entrypoints:
    name: Entrypoint smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: CLI entrypoints must be reachable
        # 実装とテストが 1 対 1 だと「外部から呼べない機能」が緑のまま残る。
        # 利用者が実際に叩く入口が起動することをここで担保する。
        run: |
          python bot/query.py --help
          python bot/export_v2.py --help
          python bot/backfill.py --help
          python crypto/build_chronica_locked.py --help || true

      - name: Pipeline must not crash on import
        run: python -c "import sys; sys.path.insert(0, 'pipeline'); import build_from_capture"

  data-boundary:
    name: Data boundary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No real data must be tracked
        # SECURITY.md の禁止データ一覧を機械で担保する。
        run: |
          set -e
          fail=0
          # basename で完全一致させる。'.env' が '.env.example' や 'envutil.py' に
          # 部分一致して誤検知した実績があるため、パターンは行頭・行末で固定する。
          while IFS= read -r f; do
            b="${f##*/}"
            case "$b" in
              *.db|*.ndjson|*-locked.html|chronica-data.js|.env)
                echo "::error::追跡してはいけないファイルが含まれています: $f"
                fail=1
                ;;
            esac
          done < <(git ls-files)
          exit $fail

      - name: No personal absolute paths
        run: |
          if git grep -nE '[A-Za-z]:[\/]{1,2}Users[\/]{1,2}[A-Za-z0-9_.-]+' -- . ; then
            echo "::error::個人環境の絶対パスが含まれています"
            exit 1
          fi
          echo "OK: 個人パスなし"
